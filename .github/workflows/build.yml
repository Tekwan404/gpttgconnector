name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build bridge
        run: dotnet build src/GptTgConnector.Bridge/GptTgConnector.Bridge.csproj --configuration Release
      - name: Validate extension JSON
        shell: pwsh
        run: Get-Content extension/manifest.json -Raw | ConvertFrom-Json | Out-Null
      - name: Validate extension JavaScript
        shell: pwsh
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('start.ps1', 'setup.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $file"
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }

          if ($failed) { exit 1 }
