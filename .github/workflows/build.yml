name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build bridge
        run: dotnet build src/GptTgConnector.Bridge/GptTgConnector.Bridge.csproj --configuration Release
      - name: Validate extension JSON
        shell: pwsh
        run: Get-Content extension/manifest.json -Raw | ConvertFrom-Json | Out-Null
